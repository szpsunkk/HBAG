name: Reproduction v2

on:
  push:
    paths:
      - 'v2/**'
      - '.github/workflows/reproduce-v2.yml'
  pull_request:
    paths:
      - 'v2/**'
      - '.github/workflows/reproduce-v2.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    strategy:
      matrix:
        python: ['3.8', '3.11']
    defaults:
      run:
        working-directory: v2
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: v2/requirements.txt
      - run: python -m pip install --upgrade pip
      - run: python -m pip install --only-binary=:all: -r requirements.txt
      - run: python -m pytest -q
      - run: python reproduce.py verify
      - run: python reproduce.py smoke
      - run: python summarize.py
